# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: aem-package-manager-api maven build

on:
  workflow_call:
    inputs:
      maven-goals:
        required: true
        type: string
      maven-profiles:
        required: true
        type: string
      maven-options:
        type: string
    secrets:
      GPG_PASSPHRASE:
        required: true
        description: "GPG Private Key"
      GPG_PASSPHRASE_PASSWORD:
        required: true
        description: "GPG Private Key Pass"

jobs:
  build:
    name: Java ${{ matrix.java }} build
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        java: [ 21 ]
        experimental: [false]
        include:
          - java: 25
            experimental: true

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        distribution: 'oracle'
        java-version: ${{ matrix.java }}
        cache: 'maven'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Install gpg secret key
      run: |
        # Install gpg secret key
        cat <(echo -e "${{ secrets.GPG_PASSPHRASE }}") | gpg --batch --import
        # Verify gpg secret key
        gpg --list-secret-keys --keyid-format LONG

    - name: Configure Git user
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"

    - name: Build only
      run: mvn 
           --batch-mode 
           --no-transfer-progress 
           ${{ inputs.maven-options }} 
           --define gpg.passphrase=${{ secrets.GPG_PASSPHRASE_PASSWORD }} 
           --settings $GITHUB_WORKSPACE/settings.xml 
           --activate-profiles ${{ inputs.maven-profiles }}
           install
      env:
        GITHUB_TOKEN: ${{ github.token }}
    
    - name: Build and Publish to GitHub Packages Apache Maven
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/tags/*') &&  !matrix.experimental # Only run on main branch or tags and non-experimental
      run: mvn 
           --batch-mode 
           --no-transfer-progress 
           ${{ inputs.maven-options }} 
           --define gpg.passphrase=${{ secrets.GPG_PASSPHRASE_PASSWORD }} 
           --settings $GITHUB_WORKSPACE/settings.xml 
           --activate-profiles ${{ inputs.maven-profiles }}
           ${{ inputs.maven-goals }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
